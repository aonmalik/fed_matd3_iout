# r_t = w_u*dU/U_ref - w_l*L/L_ref - w_e*E/E_ref - w_c*C_coll - w_o*C_bound + F_shape
reward:
  w_utility: 1.0
  w_overflow: 0.2
  w_energy: 0.1
  w_collision: 0.5
  w_boundary: 0.2
  w_shape: 0.5             # potential-based goal-approach shaping (Ng et al. 1999), preserves optimal policy
  u_ref: 50.0              # normaliser: semantic utility units
  l_ref: 50.0              # normaliser: overflow units
  e_ref_j: 100.0           # normaliser: J per step per AUV
  reward_clip: 20.0
